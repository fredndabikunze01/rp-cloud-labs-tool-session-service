
name: RP Cloud Labs CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker compose build api

      - name: Start database and supporting services
        run: docker compose up -d postgres redis kafka

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U rp_user -d rp_cloud_labs; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Flyway migrations
        run: docker compose run --rm flyway

      - name: Start application
        run: docker compose up -d api

      - name: Verify containers
        run: docker compose ps

      - name: Show logs if needed
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down
